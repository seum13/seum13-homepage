# ══════════════════════════════════════════════════════════════
#  세움 홈페이지 관리 화면 설정
#  이 파일은 관리자 화면(seum13.com/admin)이 무엇을 보여줄지 정합니다.
# ══════════════════════════════════════════════════════════════

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: seum13/seum13-homepage
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/1fab991c-2a9b-41d2-bdf6-a91926608714/pkce
  auth_token_endpoint: /sites/1fab991c-2a9b-41d2-bdf6-a91926608714/token
  gateway_url: https://gateway.decapbridge.com

# 사진을 올리면 images 폴더에 저장됩니다
media_folder: "images"
public_folder: "images"

# 관리자 화면의 버튼(Publish, Save 등)은 영어로 나옵니다.
# 입력 칸 이름(분류·제목·날짜·본문)은 아래에서 한국어로 지정해 두었습니다.

# 저장 기록에 남을 문구
site_url: https://seum13.com
display_url: https://seum13.com
logo_url: https://seum13.com/images/logo-seum.jpg

collections:
# ─────────────────────────────────────────────
  #  칼럼 (현장에서 쓰는 글)
  # ─────────────────────────────────────────────
  #  여기에 글을 저장하면 seum13.com/column/{주소}/ 페이지가
  #  자동으로 만들어집니다. 검색에 잡히는 것은 이 칼럼입니다.
  #  ※ 소식은 목록 한 줄, 칼럼은 독립된 한 페이지입니다.
  - name: "column"
    label: "칼럼"
    label_singular: "칼럼"
    folder: "data/columns"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{date}}  ·  {{title}}"
    sortable_fields: ["date", "title"]
    description: "현장에서 쓰는 글입니다. 저장하면 몇 분 뒤 seum13.com/column/ 에 새 페이지가 생깁니다. 모집 공고는 여기가 아니라 '모집 안내'에 적어주세요."
    fields:
      - name: "title"
        label: "제목"
        widget: "string"
        hint: "칼럼 목록과 페이지 맨 위에 크게 나옵니다."

      - name: "date"
        label: "날짜"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: false
        hint: "최신 글이 목록 맨 위에 옵니다."

      - name: "author"
        label: "글쓴이"
        widget: "string"
        default: "교육협동조합 세움"
        hint: "예) 진꿈이 (교육협동조합 세움)"

      - name: "kicker"
        label: "머리말"
        widget: "string"
        default: "칼럼"
        hint: "제목 위에 작게 붙는 분류입니다. 예) 함께 일하는 방법 ①, 현장에서 씁니다 No.01"

      - name: "lead"
        label: "머리 문단"
        widget: "text"
        required: false
        hint: "본문 앞에 크게 나오는 한두 문장입니다. 글을 요약하기보다 가장 하고 싶은 말을 적으세요."

      - name: "body"
        label: "본문"
        widget: "markdown"
        hint: "## 로 소제목, ### 로 작은 소제목, > 로 인용, - 로 목록, **글자** 로 굵게 표시됩니다."

      - name: "description"
        label: "검색 설명"
        widget: "text"
        required: false
        hint: "★ 구글 검색 결과에 제목 아래 나오는 설명입니다. 80~150자 정도로, 검색할 만한 말이 들어가게 적어주세요. 비워두면 본문 앞부분이 쓰입니다."

      - name: "keywords"
        label: "검색어"
        widget: "string"
        required: false
        hint: "쉼표로 구분합니다. 예) 느린학습자 취업, 경계선지능 청년, 대구 일경험"

      - name: "seo_title"
        label: "검색용 제목"
        widget: "string"
        required: false
        hint: "비워두면 '제목 | 교육협동조합 세움' 이 됩니다. 검색어를 더 넣고 싶을 때만 쓰세요."

      - name: "image"
        label: "공유 썸네일"
        widget: "image"
        required: false
        choose_url: false
        hint: "카톡·페이스북에 링크를 붙일 때 보이는 그림입니다. 가로 1200 × 세로 630 이 알맞습니다. 비워두면 세움 기본 이미지가 쓰입니다."

      - name: "note"
        label: "맨 아래 알림글"
        widget: "text"
        required: false
        hint: "예) ※ 개인정보 보호를 위해 사례는 익명·각색했습니다."

      - name: "draft"
        label: "아직 공개하지 않기"
        widget: "boolean"
        default: false
        hint: "켜두면 저장은 되지만 홈페이지에는 나오지 않습니다. 쓰는 중일 때 켜두세요."

  # ─────────────────────────────────────────────
  #  소식 · 공지
  # ─────────────────────────────────────────────
  - name: "news"
    label: "소식 · 공지"
    files:
      - name: "list"
        label: "소식 목록"
        file: "data/news.json"
        format: "json"
        description: "홈페이지 '소식' 화면에 나오는 목록입니다. 새 소식은 맨 위에 추가하세요. ※ 모집 안내는 여기에 적지 마세요 — 왼쪽 '모집 안내'에 한 번만 적으면 이 목록에 자동으로 나옵니다."
        fields:
          - name: "items"
            label: "소식"
            label_singular: "소식"
            widget: "list"
            summary: "{{fields.date}}  ·  {{fields.title}}"
            fields:
              - name: "tag"
                label: "분류"
                widget: "select"
                options: ["공지", "세움소식", "언론보도"]
                default: "공지"
                hint: "세 가지 중에서만 고르세요. 다른 값을 넣으면 필터에서 사라집니다."

              - name: "title"
                label: "제목"
                widget: "string"
                hint: "목록에 한 줄로 보이는 제목입니다."

              - name: "date"
                label: "날짜"
                widget: "string"
                pattern: ['^\d{4}\.\d{2}\.\d{2}$', "2026.08.05 처럼 점으로 구분해 적어주세요"]
                hint: "2026.08.05 형식 (점 구분, 두 자리)"

              - name: "body"
                label: "본문"
                widget: "text"
                required: false
                hint: "비워두면 제목만 한 줄로 나옵니다. 내용을 적으면 제목을 눌러 펼쳐볼 수 있습니다. 문단은 빈 줄로 나누세요."

              - name: "image"
                label: "사진"
                widget: "image"
                required: false
                choose_url: false
                hint: "선택입니다. 넣으면 제목을 눌러 펼쳤을 때 본문 위에 나옵니다. 가로 1200px 정도가 적당합니다."

              - name: "visible"
                label: "홈페이지에 보이기"
                widget: "boolean"
                default: true
                hint: "끄면 홈페이지에서 숨겨집니다. 아직 공개하기 전인 글에 쓰세요."

  # ─────────────────────────────────────────────
  #  모집 안내
  # ─────────────────────────────────────────────
  - name: "recruit"
    label: "모집 안내"
    files:
      - name: "current"
        label: "지금 모집 중"
        file: "data/recruit.json"
        format: "json"
        description: "여기에 한 번만 적으면 ① 홈 화면 모집 카드 ② 소식 화면 '지금 모집 중' 노란 상자 ③ 상세 안내 카드 ④ 소식 목록 항목까지 한꺼번에 바뀝니다. 접수 마감일이 지나면 자동으로 '마감'으로 바뀝니다."
        fields:
          - name: "featured"
            label: "지금 모집 중 (크게 보이는 안내)"
            widget: "object"
            collapsed: false
            fields:
              - name: "show"
                label: "지금 보여주기"
                widget: "boolean"
                default: true
                hint: "끄면 홈페이지에서 사라집니다. 내용은 그대로 남아 있어 다음에 참고할 수 있습니다. 모집이 끝난 경우에는 이걸 끄지 않아도 아래 '접수 마감일'이 알아서 처리합니다."

              - name: "deadline"
                label: "접수 마감일"
                widget: "string"
                required: false
                pattern: ['^(\d{4}\.\d{2}\.\d{2})?$', "2026.07.30 처럼 점으로 구분해 적어주세요"]
                hint: "★ 여기에 적어두면 마감일 다음 날부터 홈페이지가 자동으로 '모집 마감'으로 바뀝니다. 노란 상자는 사라지고, 신청 버튼도 내려가고, 소식 목록 제목 앞에 [마감]이 붙습니다. 손댈 필요가 없습니다. 상시 모집이면 비워두세요."

              - name: "after_deadline"
                label: "마감된 뒤에는"
                widget: "select"
                default: "keep"
                options:
                  - { label: "[마감] 표시하고 그대로 두기 (권장)", value: "keep" }
                  - { label: "홈페이지에서 감추기", value: "hide" }
                hint: "그대로 두면 어떤 사업을 했는지 기록으로 남고, 다음 모집 때 참고가 됩니다."

              # ── 마감 뒤 결과 알림 (합격자 발표 등) ─────────────────
              # 아래 5칸은 모두 선택입니다. 비워두면 예전처럼 회색 '모집 마감' 카드로만 남습니다.
              - name: "result_badge"
                label: "마감 뒤 결과 표시"
                widget: "string"
                required: false
                hint: "★ 예: 합격자 발표. 적어 두면 홈 화면의 회색 '모집 마감' 카드가 노란색 결과 카드로 바뀝니다. 비워두면 그대로 '모집 마감'입니다."

              - name: "result_date"
                label: "결과 발표일"
                widget: "string"
                required: false
                pattern: ['^(\d{4}\.\d{2}\.\d{2})?$', "2026.09.08 처럼 점으로 구분해 적어주세요"]
                hint: "카드에 '2026년 9월 8일(화) 발표'처럼 나옵니다."

              - name: "result_title"
                label: "결과 카드 제목"
                widget: "string"
                required: false
                hint: "비우면 원래 모집 제목을 그대로 씁니다."

              - name: "result_desc"
                label: "결과 카드 설명"
                widget: "text"
                required: false
                hint: "카드 아래에 들어갈 한–두 줄 설명입니다. 비우면 원래 모집 설명을 그대로 씁니다."

              - name: "result_news"
                label: "연결할 소식 글 제목"
                widget: "string"
                required: false
                hint: "소식에 올린 발표글의 제목을 띄어쓰기까지 똑같이 적어주세요. 카드를 누르면 그 글이 바로 펼쳐집니다."

              - name: "in_cards"
                label: "홈 화면 '지금 모집·홍보 중'에도 넣기"
                widget: "boolean"
                default: true
                hint: "켜두면 홈 화면 맨 앞 카드로 자동으로 나옵니다. 아래 '홈 화면 모집 카드' 목록에 같은 걸 또 만들지 마세요 — 두 번 나옵니다."

              - name: "in_news"
                label: "소식 목록에도 자동으로 넣기"
                widget: "boolean"
                default: true
                hint: "켜두면 이 모집 안내가 '소식' 목록에도 자동으로 한 줄 올라갑니다. 소식에 같은 내용을 또 적지 마세요 — 두 번 나옵니다."

              - name: "news_tag"
                label: "소식 목록에서의 분류"
                widget: "select"
                options: ["공지", "세움소식", "언론보도"]
                default: "공지"
                required: false

              - name: "short_title"
                label: "짧은 제목"
                widget: "string"
                hint: "소식 화면 위쪽 노란 박스에 굵게 나옵니다. 예) 직무지도원 실무교육"

              - name: "short_desc"
                label: "짧은 설명"
                widget: "text"
                hint: "노란 박스의 한두 줄 요약. 예) 7월 30일(목)까지 선착순 20명."

              - name: "short_button"
                label: "노란 박스 버튼 글자"
                widget: "string"
                default: "교육 안내 보기"

              - name: "badge"
                label: "분류 배지"
                widget: "string"
                default: "모집 공지"

              - name: "date"
                label: "게시 날짜"
                widget: "string"
                pattern: ['^\d{4}\.\d{2}\.\d{2}$', "2026.08.05 처럼 점으로 구분해 적어주세요"]

              - name: "title"
                label: "제목"
                widget: "string"
                hint: "상세 카드의 큰 제목입니다."

              - name: "image"
                label: "포스터 사진"
                widget: "image"
                required: false
                choose_url: false
                hint: "선택입니다. 안 넣으면 '안내 포스터'라고 적힌 빈 자리가 나옵니다."

              - name: "image_caption"
                label: "사진이 없을 때 보일 글자"
                widget: "string"
                required: false
                default: "안내 포스터"

              - name: "intro"
                label: "소개 문단"
                widget: "text"

              - name: "details"
                label: "일시 · 장소 등"
                widget: "list"
                label_singular: "항목"
                summary: "{{fields.label}} — {{fields.value}}"
                fields:
                  - { name: "label", label: "항목 이름", widget: "string", hint: "예) 일시, 장소, 주최·주관, 대상, 비용" }
                  - { name: "value", label: "내용", widget: "text" }

              - name: "notes_title"
                label: "안내 상자 제목"
                widget: "string"
                required: false
                default: "교육 내용"

              - name: "notes"
                label: "안내 상자 내용"
                widget: "text"
                required: false
                hint: "연한 초록 상자에 나옵니다. 줄바꿈한 대로 나옵니다."

              - name: "apply_label"
                label: "신청 버튼 글자"
                widget: "string"
                required: false
                default: "신청서 작성하기 →"

              - name: "apply_url"
                label: "신청 버튼 주소"
                widget: "string"
                required: false
                hint: "네이버폼 등 신청서 주소. 비워두면 버튼이 안 나옵니다."

              - name: "contact_label"
                label: "문의 버튼 글자"
                widget: "string"
                required: false
                default: "참가문의 070-7792-0179"

              - name: "contact_url"
                label: "문의 버튼 주소"
                widget: "string"
                required: false
                default: "tel:070-7792-0179"
                hint: "전화는 tel:070-7792-0179 형식으로 적으세요."

          - name: "cards"
            label: "홈 화면 모집 카드"
            label_singular: "카드"
            widget: "list"
            summary: "{{fields.badge}}  ·  {{fields.title}}"
            hint: "홈 화면 '지금 모집·홍보 중'에 나란히 나오는 카드입니다. 3개가 보기 좋습니다."
            fields:
              - { name: "badge", label: "배지 글자", widget: "string", default: "모집중", hint: "예) 모집중, 단체 신청, 상시 모집" }
              - name: "color"
                label: "배지 색"
                widget: "select"
                options: [{ label: "노랑 (눈에 띄게)", value: "amber" }, { label: "초록 (보통)", value: "teal" }]
                default: "teal"
              - name: "deadline"
                label: "접수 마감일"
                widget: "string"
                required: false
                pattern: ['^(\d{4}\.\d{2}\.\d{2})?$', "2026.08.22 처럼 점으로 구분해 적어주세요"]
                hint: "★ 적어두면 마감일 다음 날부터 배지가 회색 '모집 마감'으로 바뀌고 카드가 뒤로 밀립니다. 상시 모집이면 비워두세요."
              - { name: "period", label: "기간 문구", widget: "string", required: false, hint: "위 '접수 마감일'을 적으면 이 칸은 무시됩니다. 마감일이 없는 카드에만 쓰세요. 예) 9–12월 일정 협의" }
              - { name: "title", label: "제목", widget: "string" }
              - { name: "desc", label: "설명", widget: "text", hint: "줄바꿈한 대로 나옵니다." }
              - { name: "link", label: "눌렀을 때 갈 곳", widget: "string", default: "#programs", hint: "#programs 주요사업 · #news 소식 · #contact 문의하기" }
              - { name: "highlight", label: "테두리 강조", widget: "boolean", default: false }
