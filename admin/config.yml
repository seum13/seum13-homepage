# ══════════════════════════════════════════════════════════════
#  세움 홈페이지 관리 화면 설정
#  이 파일은 관리자 화면(seum13.com/admin)이 무엇을 보여줄지 정합니다.
# ══════════════════════════════════════════════════════════════

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: seum13/seum13-homepage
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/1fab991c-2a9b-41d2-bdf6-a91926608714/pkce
  auth_token_endpoint: /sites/1fab991c-2a9b-41d2-bdf6-a91926608714/token
  gateway_url: https://gateway.decapbridge.com

# 사진을 올리면 images 폴더에 저장됩니다
media_folder: "images"
public_folder: "images"

# 관리자 화면의 버튼(Publish, Save 등)은 영어로 나옵니다.
# 입력 칸 이름(분류·제목·날짜·본문)은 아래에서 한국어로 지정해 두었습니다.

# 저장 기록에 남을 문구
site_url: https://seum13.com
display_url: https://seum13.com
logo_url: https://seum13.com/images/logo-seum.jpg

collections:
  # ─────────────────────────────────────────────
  #  소식 · 공지
  # ─────────────────────────────────────────────
  - name: "news"
    label: "소식 · 공지"
    files:
      - name: "list"
        label: "소식 목록"
        file: "data/news.json"
        format: "json"
        description: "홈페이지 '소식' 화면에 나오는 목록입니다. 새 소식은 맨 위에 추가하세요."
        fields:
          - name: "items"
            label: "소식"
            label_singular: "소식"
            widget: "list"
            summary: "{{fields.date}}  ·  {{fields.title}}"
            fields:
              - name: "tag"
                label: "분류"
                widget: "select"
                options: ["공지", "세움소식", "언론보도"]
                default: "공지"
                hint: "세 가지 중에서만 고르세요. 다른 값을 넣으면 필터에서 사라집니다."

              - name: "title"
                label: "제목"
                widget: "string"
                hint: "목록에 한 줄로 보이는 제목입니다."

              - name: "date"
                label: "날짜"
                widget: "string"
                pattern: ['^\d{4}\.\d{2}\.\d{2}$', "2026.08.05 처럼 점으로 구분해 적어주세요"]
                hint: "2026.08.05 형식 (점 구분, 두 자리)"

              - name: "body"
                label: "본문"
                widget: "text"
                required: false
                hint: "비워두면 제목만 한 줄로 나옵니다. 내용을 적으면 제목을 눌러 펼쳐볼 수 있습니다. 문단은 빈 줄로 나누세요."

              - name: "image"
                label: "사진"
                widget: "image"
                required: false
                choose_url: false
                hint: "선택입니다. 넣으면 제목을 눌러 펼쳤을 때 본문 위에 나옵니다. 가로 1200px 정도가 적당합니다."

              - name: "visible"
                label: "홈페이지에 보이기"
                widget: "boolean"
                default: true
                hint: "끄면 홈페이지에서 숨겨집니다. 아직 공개하기 전인 글에 쓰세요."

  # ─────────────────────────────────────────────
  #  모집 안내
  # ─────────────────────────────────────────────
  - name: "recruit"
    label: "모집 안내"
    files:
      - name: "current"
        label: "지금 모집 중"
        file: "data/recruit.json"
        format: "json"
        description: "홈 화면의 모집 카드와, 소식 화면의 '지금 모집 중' 안내를 여기서 바꿉니다."
        fields:
          - name: "featured"
            label: "지금 모집 중 (크게 보이는 안내)"
            widget: "object"
            collapsed: false
            fields:
              - name: "show"
                label: "지금 보여주기"
                widget: "boolean"
                default: true
                hint: "모집이 끝나면 이것만 꺼도 홈페이지에서 사라집니다. 내용은 그대로 남아 있어 다음에 참고할 수 있습니다."

              - name: "short_title"
                label: "짧은 제목"
                widget: "string"
                hint: "소식 화면 위쪽 노란 박스에 굵게 나옵니다. 예) 직무지도원 실무교육"

              - name: "short_desc"
                label: "짧은 설명"
                widget: "text"
                hint: "노란 박스의 한두 줄 요약. 예) 7월 30일(목)까지 선착순 20명."

              - name: "short_button"
                label: "노란 박스 버튼 글자"
                widget: "string"
                default: "교육 안내 보기"

              - name: "badge"
                label: "분류 배지"
                widget: "string"
                default: "모집 공지"

              - name: "date"
                label: "게시 날짜"
                widget: "string"
                pattern: ['^\d{4}\.\d{2}\.\d{2}$', "2026.08.05 처럼 점으로 구분해 적어주세요"]

              - name: "title"
                label: "제목"
                widget: "string"
                hint: "상세 카드의 큰 제목입니다."

              - name: "image"
                label: "포스터 사진"
                widget: "image"
                required: false
                choose_url: false
                hint: "선택입니다. 안 넣으면 '안내 포스터'라고 적힌 빈 자리가 나옵니다."

              - name: "image_caption"
                label: "사진이 없을 때 보일 글자"
                widget: "string"
                required: false
                default: "안내 포스터"

              - name: "intro"
                label: "소개 문단"
                widget: "text"

              - name: "details"
                label: "일시 · 장소 등"
                widget: "list"
                label_singular: "항목"
                summary: "{{fields.label}} — {{fields.value}}"
                fields:
                  - { name: "label", label: "항목 이름", widget: "string", hint: "예) 일시, 장소, 주최·주관, 대상, 비용" }
                  - { name: "value", label: "내용", widget: "text" }

              - name: "notes_title"
                label: "안내 상자 제목"
                widget: "string"
                required: false
                default: "교육 내용"

              - name: "notes"
                label: "안내 상자 내용"
                widget: "text"
                required: false
                hint: "연한 초록 상자에 나옵니다. 줄바꿈한 대로 나옵니다."

              - name: "apply_label"
                label: "신청 버튼 글자"
                widget: "string"
                required: false
                default: "신청서 작성하기 →"

              - name: "apply_url"
                label: "신청 버튼 주소"
                widget: "string"
                required: false
                hint: "네이버폼 등 신청서 주소. 비워두면 버튼이 안 나옵니다."

              - name: "contact_label"
                label: "문의 버튼 글자"
                widget: "string"
                required: false
                default: "참가문의 070-7792-0179"

              - name: "contact_url"
                label: "문의 버튼 주소"
                widget: "string"
                required: false
                default: "tel:070-7792-0179"
                hint: "전화는 tel:070-7792-0179 형식으로 적으세요."

          - name: "cards"
            label: "홈 화면 모집 카드"
            label_singular: "카드"
            widget: "list"
            summary: "{{fields.badge}}  ·  {{fields.title}}"
            hint: "홈 화면 '지금 모집·홍보 중'에 나란히 나오는 카드입니다. 3개가 보기 좋습니다."
            fields:
              - { name: "badge", label: "배지 글자", widget: "string", default: "모집중", hint: "예) 모집중, 단체 신청, 상시 모집" }
              - name: "color"
                label: "배지 색"
                widget: "select"
                options: [{ label: "노랑 (눈에 띄게)", value: "amber" }, { label: "초록 (보통)", value: "teal" }]
                default: "teal"
              - { name: "period", label: "기간 문구", widget: "string", required: false, hint: "예) ~ 8월 22일(금) 접수. 비워도 됩니다." }
              - { name: "title", label: "제목", widget: "string" }
              - { name: "desc", label: "설명", widget: "text", hint: "줄바꿈한 대로 나옵니다." }
              - { name: "link", label: "눌렀을 때 갈 곳", widget: "string", default: "#programs", hint: "#programs 주요사업 · #news 소식 · #contact 문의하기" }
              - { name: "highlight", label: "테두리 강조", widget: "boolean", default: false }
