# ══════════════════════════════════════════════════════════════
#  Netlify 배포 설정
#
#  칼럼(data/columns/*.md)을 저장하면 아래 명령이 실행되어
#  column/{주소}/index.html 과 sitemap.xml 을 다시 만듭니다.
#
#  ※ 이 명령이 실패해도 홈페이지는 그대로 배포됩니다.
#    (build-columns.mjs 안에서 오류를 붙잡아 정상 종료합니다)
# ══════════════════════════════════════════════════════════════

[build]
  publish = "."
  command = "node tools/build-columns.mjs"

# ══════════════════════════════════════════════════════════════
#  옛 홈페이지 주소 정리 (2026-09-11)
#  구버전 사이트의 /board/... 주소가 아직 구글 검색결과에 남아 있다.
#  그대로 두면 방문자가 "페이지를 찾을 수 없음"을 보게 되므로
#  홈으로 넘긴다. 구글도 이 신호를 보고 옛 주소를 목록에서 내린다.
# ══════════════════════════════════════════════════════════════

[[redirects]]
  from = "/board/*"
  to = "/"
  status = 301
  force = true
